<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learning forms</title>
</head>
<body>
    <form action="https:/www.flipkart.com" method="get" style="text-align: left; font-size: 20px;">
        <label for="name">Name:</label>
        <input type="text" id="name" placeholder="Atharv Singh Rawat" name="name" value="Atharv" required minlength="3" maxlength="18" 
        style="width: 200px; height: 30px; font-size: 18px;"required>
        <br>
        <br>
        <label for="gender">Gender:</label>
        <label for="male">Male</label> 
        <input type="radio" id="male" name="gender" value="male" required>
        <label for="female">Female</label>
        <input type="radio" id="female" name="gender" value="female" required>
        <br>
        <br>
        <label for="no.">Mobile_number:</label>
        <input type="tel" id="no."  name="mobile" value="9026663404" required maxlength="10" pattern="[0-9]{10}"
        style="width: 200px; height: 30px; font-size: 18px;" required>
        <br>   
        <br>
        <label for="dob">Date of Birth:</label>
        <input type="date" id="dob" placeholder="dd/mm/yyyy" name="dob" style="width: 200px; height: 30px; font-size: 18px;" required>
        <br>   
        <br>
        <label for="mail">Mail:</label>
        <input type="email" id="mail" value="abc@gmail.com" name="email" required minlength="15" maxlength="30"
        style="width: 200px; height: 30px; font-size: 18px;"required>
        <br>
        <br>
        <label for="pass">Password:</label>
        <input type="password" id="pass" placeholder="Enter your password" name="password" required minlength="6" maxlength="10"
        style="width: 200px; height: 30px; font-size: 18px;" required>
        <br>
        <br>
        <button type="reset" style="width: 100px; height: 30px; font-size: 18px;">Reset</button>
        <br>
        <button type="submit" style="width: 100px; height: 30px; font-size: 18px;">Submit</button>

    </form>
</body>
</html>
